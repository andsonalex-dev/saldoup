services:
  app:
    build: ./docker/php
    image: saldoup-php:8.4
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      XDG_CONFIG_HOME: /tmp/saldoup-config
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: saldoup
      MYSQL_USER: saldoup
      MYSQL_PASSWORD: local-development-only
      MYSQL_ROOT_PASSWORD: local-root-only
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init-testing.sql:/docker-entrypoint-initdb.d/init-testing.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"

  node:
    image: node:22-bookworm-slim
    profiles: [tools]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /var/www/html
    environment:
      npm_config_cache: /tmp/npm
    volumes:
      - .:/var/www/html
    command: ["npm", "run", "build"]

volumes:
  mysql_data:
